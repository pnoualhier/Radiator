<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer radar reticle rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4"/>

  <!-- Radiation Trefoil symbol in center -->
  <g transform="translate(256, 256) scale(0.9)" filter="url(#glow)">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="32" fill="url(#blade)" />

    <!-- 3 Blades of trefoil: standard 60-degree sector each separated by 60 degrees -->
    <!-- Blade 1: Top (90° centered, from 60° to 120° in math coords, or -120° to -60° in screen coords) -->
    <!-- Blade 1: pointing up -->
    <path d="M 0,-48 L 0,-140 A 140,140 0 0,1 121.24,-70 L 41.57,-24 A 48,48 0 0,0 0,-48 Z" fill="url(#blade)" />
    
    <!-- Blade 2: pointing bottom-right -->
    <g transform="rotate(120)">
      <path d="M 0,-48 L 0,-140 A 140,140 0 0,1 121.24,-70 L 41.57,-24 A 48,48 0 0,0 0,-48 Z" fill="url(#blade)" />
    </g>

    <!-- Blade 3: pointing bottom-left -->
    <g transform="rotate(240)">
      <path d="M 0,-48 L 0,-140 A 140,140 0 0,1 121.24,-70 L 41.57,-24 A 48,48 0 0,0 0,-48 Z" fill="url(#blade)" />
    </g>
  </g>

  <!-- Hexagon grid accent -->
  <circle cx="256" cy="256" r="10" fill="#0f172a" />
</svg>
