<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="frenchBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="frenchRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" stroke="#334155" stroke-width="8" />

  <!-- Outer Pulse Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3" />

  <!-- Nuclear Trefoil Blades -->
  <!-- Top Blade -->
  <path d="M 256,120 A 136,136 0 0,1 324,142 L 290,202 A 68,68 0 0,0 222,202 L 188,142 A 136,136 0 0,1 256,120 Z" fill="url(#amberGlow)" filter="url(#glow)" />

  <!-- Bottom Right Blade -->
  <path d="M 374,324 A 136,136 0 0,1 324,370 L 290,310 A 68,68 0 0,0 324,251 L 392,251 A 136,136 0 0,1 374,324 Z" fill="url(#amberGlow)" filter="url(#glow)" />

  <!-- Bottom Left Blade -->
  <path d="M 138,324 A 136,136 0 0,1 120,251 L 188,251 A 68,68 0 0,0 222,310 L 188,370 A 136,136 0 0,1 138,324 Z" fill="url(#amberGlow)" filter="url(#glow)" />

  <!-- Center Core Ring & Dot -->
  <circle cx="256" cy="256" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="6" />
  <circle cx="256" cy="256" r="22" fill="url(#amberGlow)" filter="url(#glow)" />

  <!-- Tricolor subtle accents -->
  <path d="M 80,440 L 150,440" stroke="url(#frenchBlue)" stroke-width="6" stroke-linecap="round" />
  <path d="M 220,440 L 292,440" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
  <path d="M 362,440 L 432,440" stroke="url(#frenchRed)" stroke-width="6" stroke-linecap="round" />
</svg>
