<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)" />

  <!-- Window Frame -->
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#020617" stroke="#1e293b" stroke-width="2" />

  <!-- Top Browser Bar -->
  <rect x="20" y="20" width="1160" height="44" rx="16" fill="#0f172a" />
  <circle cx="50" cy="42" r="6" fill="#ef4444" />
  <circle cx="70" cy="42" r="6" fill="#f59e0b" />
  <circle cx="90" cy="42" r="6" fill="#10b981" />
  <rect x="360" y="30" width="480" height="24" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
  <text x="600" y="46" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">https://radiation.france.gouv.fr/surveillance</text>

  <!-- App Header -->
  <rect x="20" y="64" width="1160" height="64" fill="#020617" border-bottom="1" />
  <line x1="20" y1="128" x2="1180" y2="128" stroke="#1e293b" stroke-width="1" />
  <rect x="44" y="80" width="36" height="36" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" />
  <text x="62" y="103" font-family="sans-serif" font-size="18" fill="#f59e0b" text-anchor="middle">☢</text>
  <text x="92" y="98" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff">RADIO FRANCE</text>
  <text x="92" y="112" font-family="monospace" font-size="10" fill="#64748b">Surveillance radiologique d'État (Téléray • IRSN/ASNR)</text>

  <!-- Header Badges -->
  <rect x="880" y="82" width="130" height="28" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
  <circle cx="896" cy="96" r="4" fill="#10b981" />
  <text x="950" y="100" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">En direct • 457 balises</text>
  <rect x="1024" y="82" width="120" height="28" rx="8" fill="#f59e0b" />
  <text x="1084" y="100" font-family="monospace" font-size="11" font-weight="bold" fill="#020617" text-anchor="middle">Installer l'app 📱</text>

  <!-- Left Column: National Map Card -->
  <rect x="44" y="148" width="540" height="490" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
  <rect x="60" y="164" width="508" height="38" rx="8" fill="#020617" />
  <text x="76" y="188" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">🗺️ Carte interactive du territoire (Téléray)</text>
  <!-- Simulated Map Area -->
  <rect x="60" y="214" width="508" height="404" rx="12" fill="#020617" stroke="#0f172a" />
  <!-- Map Grid lines -->
  <path d="M 120,240 Q 280,260 480,240 M 100,340 Q 300,360 500,340 M 120,460 Q 320,440 480,480" stroke="#1e293b" stroke-width="1" fill="none" stroke-dasharray="4 4" />
  <!-- Map Clusters and Points -->
  <circle cx="280" cy="300" r="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
  <text x="280" y="304" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">98</text>
  <circle cx="180" cy="360" r="22" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
  <text x="180" y="364" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">145</text>
  <circle cx="420" cy="380" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
  <text x="420" y="384" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">85</text>
  <circle cx="340" cy="480" r="20" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
  <text x="340" y="484" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="middle">112</text>

  <!-- Right Column Top: Live Gauge & Station Card -->
  <rect x="604" y="148" width="552" height="180" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
  <text x="628" y="176" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Station Limoges-Centre (87) • Haute-Vienne</text>
  <text x="628" y="194" font-family="monospace" font-size="10" fill="#64748b">Réseau d'alerte permanent Téléray • Dernière mesure vérifiée</text>
  <text x="628" y="250" font-family="monospace" font-size="44" font-weight="bold" fill="#fbbf24">112.4</text>
  <text x="770" y="240" font-family="monospace" font-size="14" fill="#94a3b8">nSv/h</text>
  <rect x="628" y="270" width="320" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
  <text x="638" y="286" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">✅ Bruit de fond naturel nominal (Massif granitique)</text>

  <!-- Right Column Middle: 24h Recharts Graph -->
  <rect x="604" y="344" width="552" height="150" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
  <text x="628" y="370" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">📈 Évolution sur 24 heures glissantes (Recharts)</text>
  <path d="M 628,450 Q 720,440 780,420 T 900,430 T 1000,410 T 1120,435" fill="none" stroke="#f59e0b" stroke-width="2.5" />
  <path d="M 628,450 Q 720,440 780,420 T 900,430 T 1000,410 T 1120,435 L 1120,470 L 628,470 Z" fill="url(#chartGrad)" />
  <line x1="628" y1="435" x2="1120" y2="435" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
  <text x="1110" y="430" font-family="monospace" font-size="9" fill="#10b981" text-anchor="end">Moy: 110.2 nSv/h</text>

  <!-- Right Column Bottom: "Pourquoi cette valeur ?" Panel Preview -->
  <rect x="604" y="508" width="552" height="130" rx="16" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
  <text x="628" y="534" font-family="monospace" font-size="11" font-weight="bold" fill="#fcd34d">💡 Pourquoi cette valeur ? (5 composantes physiques)</text>
  <rect x="628" y="548" width="100" height="26" rx="6" fill="#020617" stroke="#334155" />
  <text x="678" y="565" font-family="monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">🌍 Géologie</text>
  <rect x="734" y="548" width="100" height="26" rx="6" fill="#020617" stroke="#334155" />
  <text x="784" y="565" font-family="monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">☁️ Météo/Radon</text>
  <rect x="840" y="548" width="100" height="26" rx="6" fill="#020617" stroke="#334155" />
  <text x="890" y="565" font-family="monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">☢️ Fond naturel</text>
  <rect x="946" y="548" width="100" height="26" rx="6" fill="#020617" stroke="#334155" />
  <text x="996" y="565" font-family="monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">🌌 Cosmique</text>
  <rect x="1052" y="548" width="90" height="26" rx="6" fill="#020617" stroke="#334155" />
  <text x="1097" y="565" font-family="monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">📡 Capteur</text>
  <text x="628" y="605" font-family="monospace" font-size="10" fill="#94a3b8">Doctrine ASNR : Les variations naturelles locales n'ont aucun caractère accidentel.</text>
</svg>
