services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radiation-france-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/radiation.db
      - ADMIN_API_KEY=dev-secret-key-change-in-production
      - TELERAY_ENABLED=true
      - TELERAY_BASE_URL=https://teleray.irsn.fr/api
      - EURDEP_ENABLED=false
      - OPENRADIATION_ENABLED=false
      - SAFECAST_ENABLED=false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: radiation-france-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
