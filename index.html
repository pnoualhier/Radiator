<!doctype html>
<html lang="fr" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Radiation France — Surveillance Radiologique</title>
    <meta name="description" content="PWA de surveillance de la radioactivité environnementale en France métropolitaine et Corse (données Téléray/ASNR-IRSN, EURDEP, OpenRadiation, Safecast)." />
    <meta property="og:title" content="Radiation France — Surveillance Radiologique" />
    <meta property="og:description" content="PWA de surveillance de la radioactivité environnementale en France métropolitaine et Corse (données Téléray/ASNR-IRSN, EURDEP, OpenRadiation, Safecast)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RadiationFR" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      // Automatically unregister stale or broken Service Workers in preview to prevent white screens caused by outdated asset hashes
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh;" class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <!-- Fallback loader to prevent white screen while bundle loads -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; color: #94a3b8; background-color: #020617; padding: 20px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: rfSpin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 16px; font-weight: bold; color: #f8fafc; letter-spacing: 0.08em;">RADIATION FRANCE</div>
        <div style="font-size: 11px; color: #64748b; margin-top: 6px;">Initialisation de la surveillance radiologique...</div>
      </div>
      <style>
        @keyframes rfSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
